# Temporary HTTP-only virtual host for issuing the domain's first certificate.
# Replace YOUR_MCP_DOMAIN, validate with nginx -t, then reload nginx.
server {
    listen 80;
    server_name YOUR_MCP_DOMAIN;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/localmcp-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
