# Replace YOUR_MCP_DOMAIN and the certificate paths before enabling this file.
# This server block matches only the chosen MCP hostname; it does not claim a
# default listener or change unrelated virtual hosts.
server {
    listen 80;
    server_name YOUR_MCP_DOMAIN;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/localmcp-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_MCP_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_MCP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_MCP_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LocalMCP:10m;
    ssl_session_timeout 10m;

    # MCP bearer tokens are embedded in the request path. Do not log paths.
    access_log off;
    client_max_body_size 32m;

    location ^~ /mcp/ {
        proxy_pass http://127.0.0.1:43128;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
